# Linkerd trust anchor — the root CA for the entire mesh.
# Stored in the cert-manager namespace so trust-manager can read it
# and distribute it as a ConfigMap to the linkerd namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-trust-anchor
  namespace: cert-manager
spec:
  isCA: true
  commonName: root.linkerd.cluster.local
  secretName: linkerd-trust-anchor
  privateKey:
    algorithm: ECDSA
    size: 256
  duration: 87600h   # 10 years — trust anchors rotate rarely
  renewBefore: 720h  # renew 30 days before expiry
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
