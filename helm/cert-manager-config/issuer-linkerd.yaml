# ClusterIssuer backed by the trust anchor secret.
# ClusterIssuers read their CA secret from the cert-manager namespace by default,
# which is where the linkerd-trust-anchor secret lives.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: linkerd-trust-anchor
spec:
  ca:
    secretName: linkerd-trust-anchor
