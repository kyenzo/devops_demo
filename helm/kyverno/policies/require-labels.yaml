apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  labels:
    environment: prod
    managedBy: argocd
    project: eks-demo
  annotations:
    policies.kyverno.io/title: Require Standard Labels
    policies.kyverno.io/description: >-
      All pods in web-server and kafka namespaces must have an 'app' label
      for consistent identification in monitoring and dashboards.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-pod-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - web-server
                - kafka
      validate:
        message: "Pod must have an 'app' label."
        pattern:
          metadata:
            labels:
              app: "?*"
