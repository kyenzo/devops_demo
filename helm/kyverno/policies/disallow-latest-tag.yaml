apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  labels:
    environment: prod
    managedBy: argocd
    project: eks-demo
  annotations:
    policies.kyverno.io/title: Disallow Latest Image Tag
    policies.kyverno.io/description: >-
      The :latest image tag must not be used in the web-server namespace.
      Always pin to an explicit version for reproducible deployments.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - web-server
      validate:
        message: "Image tag ':latest' is not allowed. Use an explicit version tag (e.g. :1.0.0)."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
