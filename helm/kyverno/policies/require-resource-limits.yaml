apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  labels:
    environment: prod
    managedBy: argocd
    project: eks-demo
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/description: >-
      All containers in web-server and kafka namespaces must define
      CPU and memory limits to prevent resource exhaustion.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-container-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - web-server
                - kafka
      validate:
        message: "CPU and memory limits must be defined for all containers."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
