# Kyverno - Kubernetes Policy Engine
# Single replica for cost optimization (demo setup)

admissionController:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

backgroundController:
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

cleanupController:
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

reportsController:
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Override the bitnami/kubectl image used by internal cleanup CronJobs.
# The patch-version tag (e.g. 1.28.5) is not published on Docker Hub;
# using the minor-version tag (1.28) which is always available.
cleanupJobs:
  admissionReports:
    image:
      tag: "1.28"
  clusterAdmissionReports:
    image:
      tag: "1.28"
  updateRequests:
    image:
      tag: "1.28"
