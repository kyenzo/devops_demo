# Kyverno - Kubernetes Policy Engine
# Single replica for cost optimization (demo setup)

admissionController:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

backgroundController:
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

cleanupController:
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

reportsController:
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Override the bitnami/kubectl image used by internal cleanup CronJobs.
# Since September 2025, Bitnami only publishes 'latest' on Docker Hub free tier;
# specific version tags (e.g. 1.28.5, 1.28) are no longer available.
cleanupJobs:
  admissionReports:
    image:
      tag: "latest"
  clusterAdmissionReports:
    image:
      tag: "latest"
  updateRequests:
    image:
      tag: "latest"
