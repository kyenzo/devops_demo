# Kyverno - Kubernetes Policy Engine
# Single replica for cost optimization (demo setup)

admissionController:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

backgroundController:
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

cleanupController:
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

reportsController:
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Override ALL bitnami/kubectl images in the chart.
# Since September 2025, Bitnami only publishes 'latest' on Docker Hub free tier;
# specific version tags (e.g. 1.28.5) are no longer available.

# Post-upgrade hook: cleans up old policy reports on every Helm upgrade/sync
policyReportsCleanup:
  image:
    tag: "latest"
    pullPolicy: Always

# Pre-delete hook: cleans up webhooks when Helm release is deleted
webhooksCleanup:
  image:
    tag: "latest"
    pullPolicy: Always

# Disable cleanup CronJobs - only needed at scale (10k+ admission reports).
# Not required for a demo setup.
cleanupJobs:
  admissionReports:
    enabled: false
  clusterAdmissionReports:
    enabled: false
  ephemeralReports:
    enabled: false
  clusterEphemeralReports:
    enabled: false
  updateRequests:
    enabled: false
