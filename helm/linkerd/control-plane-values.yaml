# Linkerd control plane — cert-manager + trust-manager integration
#
# trustAnchorsPEM below is read by the Linkerd control plane at startup.
# The linkerd-identity-trust-roots ConfigMap (mounted by every proxy sidecar)
# is maintained automatically by trust-manager via the Bundle resource in
# helm/cert-manager-config/trust-bundle.yaml — no manual ConfigMap needed.
#
# The private key is preserved in AWS Secrets Manager (linkerd/trust-anchor)
# and restored by ESO on every cluster rebuild, so this cert never changes.

identity:
  # Linkerd reads the identity issuer cert/key from the 'linkerd-identity-issuer'
  # secret in the linkerd namespace — managed automatically by cert-manager.
  externalCA: true
  issuer:
    scheme: kubernetes.io/tls

  # Trust anchor public certificate — paste output of the kubectl command above.
  trustAnchorsPEM: |
    -----BEGIN CERTIFICATE-----
    MIIBiTCCATCgAwIBAgIQbUlQeCfhOuSHfJLmbOek+jAKBggqhkjOPQQDAjAlMSMw
    IQYDVQQDExpyb290LmxpbmtlcmQuY2x1c3Rlci5sb2NhbDAeFw0yNjAzMDQyMzA4
    MjRaFw0zNjAzMDEyMzA4MjRaMCUxIzAhBgNVBAMTGnJvb3QubGlua2VyZC5jbHVz
    dGVyLmxvY2FsMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEzeeQR5h2sjKp2msH
    8MbX4wMEShIfcP1POFPSl/Ajh3A4yxBB5uXVX9LfiYqeaXSPpGJzugFN2TfvXJzg
    Qw1LB6NCMEAwDgYDVR0PAQH/BAQDAgKkMA8GA1UdEwEB/wQFMAMBAf8wHQYDVR0O
    BBYEFCQBa+YP960fgS4i+h+IdB/GeFTxMAoGCCqGSM49BAMCA0cAMEQCIBm7r2kd
    aCQYPqLzDlW6IlOzYByuv6IrRA7OuBu5sEvDAiAmGqgcrDWYDknAY1gt0OfOFWLn
    fcH9FfimplOYZQ74VA==
    -----END CERTIFICATE-----

proxy:
  resources:
    cpu:
      request: 10m
      limit: 1000m
    memory:
      request: 20Mi
      limit: 250Mi

proxyInit:
  # Required on EKS to allow the init container to configure iptables
  runAsRoot: true
