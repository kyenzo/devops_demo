# ExternalSecret — restores the Linkerd trust anchor from AWS Secrets Manager
# into the cert-manager namespace on every cluster start.
# cert-manager sees the secret already exists and skips regeneration,
# ensuring the same trust anchor (and trustAnchorsPEM) is used every time.
#
# Populate AWS SM once after first cluster creation:
#   aws secretsmanager create-secret \
#     --name linkerd/trust-anchor \
#     --secret-string "{
#       \"tls.crt\": \"$(kubectl get secret linkerd-trust-anchor -n cert-manager \
#                         -o jsonpath='{.data.tls\.crt}' | base64 -d)\",
#       \"tls.key\": \"$(kubectl get secret linkerd-trust-anchor -n cert-manager \
#                         -o jsonpath='{.data.tls\.key}' | base64 -d)\"
#     }"
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: linkerd-trust-anchor
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: linkerd-trust-anchor
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: tls.crt
      remoteRef:
        key: linkerd/trust-anchor
        property: tls.crt
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: tls.key
      remoteRef:
        key: linkerd/trust-anchor
        property: tls.key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
