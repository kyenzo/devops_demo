# ApplicationSet for git-path apps (single source from our repo)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prod-git-apps
  namespace: argocd
  labels:
    environment: prod
    managedBy: argocd
    project: eks-demo
spec:
  generators:
    - list:
        elements:
          - name: kyverno-policies
            namespace: kyverno
            path: helm/kyverno/policies
            syncWave: "-1"

          - name: web-server
            namespace: web-server
            path: helm/web-server
            syncWave: "0"

          - name: kafka-cluster
            namespace: kafka
            path: helm/kafka/cluster
            syncWave: "0"

  template:
    metadata:
      name: "{{name}}"
      namespace: argocd
      labels:
        environment: prod
        managedBy: argocd
        project: eks-demo
      annotations:
        argocd.argoproj.io/sync-wave: "{{syncWave}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: prod
      source:
        repoURL: https://github.com/kyenzo/devops_demo.git
        targetRevision: master
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m

---

# ApplicationSet for external Helm chart apps (multi-source)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prod-helm-apps
  namespace: argocd
  labels:
    environment: prod
    managedBy: argocd
    project: eks-demo
spec:
  generators:
    - list:
        elements:
          - name: kyverno
            namespace: kyverno
            chartRepo: https://kyverno.github.io/kyverno/
            chart: kyverno
            chartVersion: "3.2.6"
            valuesFile: helm/kyverno/values.yaml
            syncWave: "-2"

          - name: monitoring
            namespace: monitoring
            chartRepo: https://prometheus-community.github.io/helm-charts
            chart: kube-prometheus-stack
            chartVersion: "67.2.0"
            valuesFile: helm/prometheus/values.yaml
            syncWave: "0"

          - name: kafka-operator
            namespace: kafka
            chartRepo: https://strimzi.io/charts/
            chart: strimzi-kafka-operator
            chartVersion: "0.49.1"
            valuesFile: helm/kafka/values.yaml
            syncWave: "0"

          - name: kafka-ui
            namespace: kafka
            chartRepo: https://provectus.github.io/kafka-ui-charts
            chart: kafka-ui
            chartVersion: "0.7.6"
            valuesFile: helm/kafka-ui/values.yaml
            syncWave: "0"

  template:
    metadata:
      name: "{{name}}"
      namespace: argocd
      labels:
        environment: prod
        managedBy: argocd
        project: eks-demo
      annotations:
        argocd.argoproj.io/sync-wave: "{{syncWave}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: prod
      sources:
        - repoURL: "{{chartRepo}}"
          chart: "{{chart}}"
          targetRevision: "{{chartVersion}}"
          helm:
            valueFiles:
              - "$values/{{valuesFile}}"
        - repoURL: https://github.com/kyenzo/devops_demo.git
          targetRevision: master
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      ignoreDifferences:
        - group: batch
          kind: CronJob
          jqPathExpressions:
            - .status
            - .spec.jobTemplate.spec.template.spec.containers[].terminationMessagePath
            - .spec.jobTemplate.spec.template.spec.containers[].terminationMessagePolicy
            - .spec.jobTemplate.spec.template.spec.dnsPolicy
            - .spec.jobTemplate.spec.template.spec.schedulerName
            - .spec.jobTemplate.spec.template.spec.securityContext
            - .spec.jobTemplate.spec.template.spec.serviceAccount
            - .spec.jobTemplate.spec.template.spec.terminationGracePeriodSeconds
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ServerSideDiff=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
